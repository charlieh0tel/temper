[package]
name = "temper-iio"
description = "Present a PCsensor TEMPerGold, TEMPerHUM or TEMPer2 stick as Linux IIO devices"
license = "GPL-3.0-or-later"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

# The version stamp is `temper-hid-cli`'s, shared so both binaries
# agree.
build = "../temper-hid-cli/build.rs"

[[bin]]
name = "temper-iio"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = "0.2.38"
rustix = { version = "1.1.5", features = ["event", "fs", "std", "time"] }
signal-hook = "0.4.5"
temper-hid.workspace = true
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.deb]
name = "temper-iio"
maintainer = "Christopher Hoover <ch@murgatroid.com>"
copyright = "2026, Christopher Hoover"
extended-description = """\
Presents a PCsensor TEMPerGold or TEMPer2 USB thermometer, or a \
TEMPerHUM thermometer and hygrometer, as Linux IIO devices.  The temper-iio daemon \
reads the stick over hidraw and creates a virtual HID sensor through \
/dev/uhid, which the kernel's HID sensor drivers turn into ordinary \
iio:deviceN entries, linked as /run/temper-iio/<label>. \
udev starts it when the stick is plugged in."""
section = "utils"
priority = "optional"
# systemd 253 for OpenFile= in the unit.
# temper for the udev rule and group that give access to the stick.
depends = "$auto, adduser, systemd (>= 253), temper"
assets = [
    ["target/release/temper-iio", "usr/bin/", "755"],
    ["../../packaging/udev/60-temper-iio.rules", "usr/lib/udev/rules.d/60-temper-iio.rules", "644"],
    ["../../packaging/systemd/temper-iio@.service", "usr/lib/systemd/system/temper-iio@.service", "644"],
    ["../../packaging/systemd/temper-iio.default", "etc/default/temper-iio", "644"],
    ["../../packaging/tmpfiles.d/temper-iio.conf", "usr/lib/tmpfiles.d/temper-iio.conf", "644"],
    ["../../README.md", "usr/share/doc/temper-iio/README.md", "644"],
    ["../../docs/running.md", "usr/share/doc/temper-iio/running.md", "644"],
    ["../../docs/daemon.md", "usr/share/doc/temper-iio/daemon.md", "644"],
    ["../../docs/protocol.md", "usr/share/doc/temper-iio/protocol.md", "644"],
]
conf-files = ["/etc/default/temper-iio"]
maintainer-scripts = "../../packaging/debian/temper-iio/"
changelog = "../../packaging/debian/changelog"
# No systemd-units: the unit is a template that udev starts per stick,
# installed as a plain asset above; the maintainer scripts do the rest.
