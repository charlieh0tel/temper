[package]
name = "temper-hid"
description = "Read a PCsensor TEMPerGold USB thermometer or TEMPerHUM thermometer and hygrometer on Linux and Windows"
license = "MIT OR Apache-2.0"
categories = ["hardware-support"]
keywords = ["temper", "thermometer", "hygrometer", "hidraw", "usb"]
readme = "README.md"
# Published from CI on every release tag; see RELEASING.md.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

# The hid module exists on Linux and Windows.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[dependencies]
thiserror = "2.0.21"

# ENODEV for removal on Unix; poll(2) for hidraw on Linux.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["event", "fs"] }

# The Windows backend: hidapi's pure-Rust Windows code, with none of its
# C backends (PLAN.md, "Transport").
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3.27.0"
