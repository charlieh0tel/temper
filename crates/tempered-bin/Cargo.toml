[package]
name = "tempered-bin"
description = "Read a PCsensor TEMPerGold USB thermometer and present it as a Linux IIO device"
license = "GPL-3.0-or-later"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "tempered"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
tempered = { version = "0.1.0", path = "../tempered" }

[lints]
workspace = true
