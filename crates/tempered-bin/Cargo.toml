[package]
name = "tempered-bin"
description = "Read a PCsensor TEMPerGold or TEMPerHUM USB stick and present it as Linux IIO devices"
license = "GPL-3.0-or-later"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "tempered"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = "0.2.38"
rustix = { version = "1.1.5", features = ["event", "fs", "std", "time"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
signal-hook = "0.4.5"
# Path only: this crate is not published, and a version here would
# have to be bumped with every release.
tempered-hid = { path = "../tempered-hid" }
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.deb]
name = "tempered"
maintainer = "Christopher Hoover <ch@murgatroid.com>"
copyright = "2026, Christopher Hoover"
extended-description = """\
Presents a PCsensor TEMPerGold USB thermometer, or a TEMPerHUM \
thermometer and hygrometer, as Linux IIO devices.  The tempered daemon \
reads the stick over hidraw and creates a virtual HID sensor through \
/dev/uhid, which the kernel's HID sensor drivers turn into ordinary \
iio:deviceN entries, linked as /run/tempered/<label>. \
udev starts it when the stick is plugged in."""
section = "utils"
priority = "optional"
# systemd 253 for OpenFile= in the unit.
depends = "$auto, adduser, systemd (>= 253)"
assets = [
    ["target/release/tempered", "usr/bin/", "755"],
    ["../../packaging/udev/60-tempered.rules", "usr/lib/udev/rules.d/60-tempered.rules", "644"],
    ["../../packaging/systemd/tempered@.service", "usr/lib/systemd/system/tempered@.service", "644"],
    ["../../packaging/systemd/tempered.default", "etc/default/tempered", "644"],
    ["../../packaging/tmpfiles.d/tempered.conf", "usr/lib/tmpfiles.d/tempered.conf", "644"],
    ["../../packaging/system-sleep/tempered", "usr/lib/systemd/system-sleep/tempered", "755"],
    ["../../README.md", "usr/share/doc/tempered/README.md", "644"],
    ["../../docs/running.md", "usr/share/doc/tempered/running.md", "644"],
    ["../../docs/daemon.md", "usr/share/doc/tempered/daemon.md", "644"],
    ["../../docs/protocol.md", "usr/share/doc/tempered/protocol.md", "644"],
]
conf-files = ["/etc/default/tempered"]
maintainer-scripts = "../../packaging/debian/"
changelog = "../../packaging/debian/changelog"
# No systemd-units: the unit is a template that udev starts per stick,
# installed as a plain asset above; the maintainer scripts do the rest.
