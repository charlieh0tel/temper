[package]
name = "tempered-hid"
description = "Read a PCsensor TEMPerGold USB thermometer or TEMPerHUM thermometer and hygrometer over Linux hidraw"
license = "MIT OR Apache-2.0"
categories = ["hardware-support"]
keywords = ["temper", "thermometer", "hygrometer", "hidraw", "usb"]
readme = "README.md"
# Published from CI on every release tag; see RELEASING.md.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

# hidraw and poll(2) are Linux's.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
rustix = { version = "1.1.5", features = ["event", "fs"] }
thiserror = "2.0.21"
