[package]
name = "temper-hid-cli"
description = "Command-line tool for PCsensor TEMPerGold, TEMPerHUM and TEMPer2 USB sticks"
license = "GPL-3.0-or-later"
categories = ["command-line-utilities", "hardware-support"]
keywords = ["temper", "thermometer", "hygrometer", "hidraw", "usb"]
readme = "README.md"
# Published from CI on every release tag; see RELEASING.md.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "temper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
temper-hid.workspace = true

[lints]
workspace = true

[package.metadata.deb]
name = "temper"
maintainer = "Christopher Hoover <ch@murgatroid.com>"
copyright = "2026, Christopher Hoover"
extended-description = """\
temper reads a PCsensor TEMPerGold or TEMPer2 USB thermometer or a \
TEMPerHUM thermometer and hygrometer over hidraw: the reading, what the stick \
reports about itself, and a JSON Lines log.  Access to the stick's \
hidraw node is given to group temper and to the user at the seat."""
section = "utils"
priority = "optional"
depends = "$auto, adduser"
suggests = "temper-iio"
assets = [
    ["target/release/temper", "usr/bin/", "755"],
    ["../../packaging/udev/60-temper.rules", "usr/lib/udev/rules.d/60-temper.rules", "644"],
    ["README.md", "usr/share/doc/temper/README.md", "644"],
]
changelog = "../../packaging/debian/changelog"
maintainer-scripts = "../../packaging/debian/temper/"
