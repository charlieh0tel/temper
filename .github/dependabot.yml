version: 2

updates:
# Third-party actions here are pinned to a full commit SHA with the tag it
# came from in a trailing comment. Dependabot bumps both together, so the
# comment stays truthful -- without something moving them, pinned actions just
# go stale. deb-workflows@v1 is ours and a tag kept moving on purpose; it is
# only mentioned here if it ever gets a new major.
#
# Actions only: Cargo advisories are audit.yml's job, and version bumps
# alone are noise.
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    actions:
      patterns: ["*"]
