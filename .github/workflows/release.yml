name: release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  # A hand-made tag that skipped `make release` would otherwise build
  # the old version with new code.  Everything waits on this.
  versions:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag, Cargo.toml and changelog name one version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo=$(sed -n '0,/^version = "\(.*\)"/s//\1/p' Cargo.toml)
          changelog=$(sed -n '1s/^[a-z0-9.+-]* (\([^-)]*\)-[^)]*).*/\1/p' packaging/debian/changelog)
          echo "tag ${TAG#v}, Cargo.toml $cargo, changelog $changelog"
          test "${TAG#v}" = "$cargo"
          test "$cargo" = "$changelog"

  deb:
    needs: versions
    # The shared definition: audits Cargo.lock, builds the .deb for
    # amd64 and arm64 with cargo-deb (which picks the one crate carrying
    # [package.metadata.deb], tempered-bin), and creates the release.
    # It reads the toolchain from rust-toolchain.toml.
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    # Scoped to this job, not the dispatch job below.
    permissions:
      contents: write

  # The release's notes are the changelog entry the release commit
  # wrote.
  notes:
    needs: deb
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set the release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./packaging/release-notes.sh > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

  # Publishes the temper-hid library to crates.io with Trusted
  # Publishing, as usbrelay-rs and ut325f-rs do: crates.io trusts this
  # repository and this workflow file, and mints a short-lived token for
  # the run's OIDC claim, so no registry token is stored here.  Runs
  # after the .deb build, whose audit job gates it.  The library shares
  # the workspace version, so every release publishes it.
  publish-crate:
    needs: deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC claim crates.io checks.  Nothing else in this file needs it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish -p temper-hid
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  trigger-apt-repo:
    needs: deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      # workflow_dispatch, not repository_dispatch: the token then needs
      # Actions: write on apt-repo instead of Contents: write.
      - name: Trigger APT repo rebuild
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: gh workflow run update-repo.yml -R charlieh0tel/apt-repo
