name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # The shared definition, so this repo's CI matches the others.
    #
    #   fmt-toolchain  empty, not nightly: rust-toolchain.toml pins the
    #                  compiler and the fmt job resolves the same way.
    #   audit          off here; audit.yml runs it weekly and on lockfile changes.
    #   check-args     --workspace --all-targets, or clippy never sees
    #                  the tests.
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-ci.yml@v1
    with:
      fmt-toolchain: ""
      audit: false
      check-args: "--workspace --all-targets"

  windows:
    # The temper CLI, and through it the library, built and tested
    # natively on Windows (MSVC).  `make windows-check` does the same
    # from Linux, cross-built and under wine.  No release here: the
    # shared workflow releases only on tags.
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-exes.yml@v1
    with:
      package: temper-hid-cli
      test-windows: true
      audit: false
      targets: '[{"target":"x86_64-pc-windows-msvc","os":"windows-latest","arch":"amd64"}]'
