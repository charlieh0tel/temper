name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # The shared definition, so this repo's CI matches the others.
    #
    #   fmt-toolchain  empty, not nightly: rust-toolchain.toml pins the
    #                  compiler and the fmt job resolves the same way.
    #   audit          off here; audit.yml runs it weekly and on lockfile changes.
    #   check-args     --workspace --all-targets, or clippy never sees
    #                  the daemon crate or the tests.
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-ci.yml@v1
    with:
      fmt-toolchain: ""
      audit: false
      check-args: "--workspace --all-targets"
