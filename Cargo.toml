# Do not add default-members: a bare `cargo test` covers every member
# only while it is absent.
[workspace]
members = ["crates/tempered-hid", "crates/tempered-bin"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Christopher Hoover <ch@murgatroid.com>"]
repository = "https://github.com/charlieh0tel/tempered-hid"

# Stripped in the packaged build: lintian objects to unstripped
# binaries.  A panic aborts, so a dead daemon thread ends the process
# instead of leaving it half alive; profiles never apply to library
# users or to tests.
[profile.release]
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
doc_markdown = "warn"
enum_glob_use = "deny"
todo = "warn"
