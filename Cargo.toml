# Do not add default-members: a bare `cargo test` covers every member
# only while it is absent.
[workspace]
members = ["crates/temper-hid", "crates/temper-hid-cli", "crates/temper-iio"]
resolver = "3"

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["Christopher Hoover <ch@murgatroid.com>"]
repository = "https://github.com/charlieh0tel/temper"

# The library at the workspace version: `temper-hid-cli` is published
# and needs a version to depend on it; `make release` keeps this in
# step with `version` above.
[workspace.dependencies]
temper-hid = { path = "crates/temper-hid", version = "1.2.0" }

# Stripped in the packaged build: lintian objects to unstripped
# binaries.  A panic aborts, so a dead daemon thread ends the process
# instead of leaving it half alive; profiles never apply to library
# users or to tests.
[profile.release]
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
doc_markdown = "warn"
enum_glob_use = "deny"
todo = "warn"
